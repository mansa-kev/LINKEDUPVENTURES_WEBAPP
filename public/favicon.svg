<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115" width="100" height="115">
  <defs>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3d6b"/>
      <stop offset="100%" stop-color="#0a1828"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6aaff0"/>
      <stop offset="100%" stop-color="#2c6ab5"/>
    </linearGradient>
  </defs>

  <!-- Shield border -->
  <path d="M50,2 L96,17 L96,60 Q96,90 50,113 Q4,90 4,60 L4,17 Z"
        fill="url(#shieldBorder)" />
  <!-- Shield inner fill -->
  <path d="M50,7 L91,20 L91,60 Q91,86 50,108 Q9,86 9,60 L9,20 Z"
        fill="url(#shieldBg)" />

  <!-- Car body -->
  <rect x="21" y="53" width="58" height="13" rx="3" fill="white" opacity="0.95"/>
  <!-- Car roof -->
  <path d="M31,53 Q36,41 42,39 L58,39 Q64,41 69,53 Z" fill="white" opacity="0.95"/>
  <!-- Window split -->
  <line x1="50" y1="39.5" x2="50" y2="53" stroke="#0a1828" stroke-width="1.5"/>
  <!-- Roof pillars -->
  <line x1="32" y1="53" x2="38.5" y2="40" stroke="#0a1828" stroke-width="1.2"/>
  <line x1="68" y1="53" x2="61.5" y2="40" stroke="#0a1828" stroke-width="1.2"/>
  <!-- Front grille detail -->
  <rect x="21" y="60" width="6" height="6" rx="1" fill="white" opacity="0.3"/>
  <!-- Rear light -->
  <rect x="73" y="57" width="6" height="4" rx="1" fill="white" opacity="0.3"/>
  <!-- Wheels -->
  <circle cx="33" cy="66" r="7" fill="#071020" stroke="white" stroke-width="2.2"/>
  <circle cx="33" cy="66" r="3" fill="white" opacity="0.9"/>
  <circle cx="67" cy="66" r="7" fill="#071020" stroke="white" stroke-width="2.2"/>
  <circle cx="67" cy="66" r="3" fill="white" opacity="0.9"/>

  <!-- LINKEDUP text -->
  <text x="50" y="83"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="8" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="0.8">LINKEDUP</text>

  <!-- Gold stars -->
  <text x="50" y="95"
        font-family="Arial, sans-serif"
        font-size="7" fill="#f5c518" text-anchor="middle">★ ★ ★ ★ ★</text>

  <!-- Bottom rule lines -->
  <line x1="20" y1="98" x2="80" y2="98" stroke="#4a7ab5" stroke-width="0.8" opacity="0.7"/>
  <line x1="25" y1="101" x2="75" y2="101" stroke="#4a7ab5" stroke-width="0.5" opacity="0.5"/>
</svg>
